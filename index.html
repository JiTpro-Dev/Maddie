<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maddie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Reset & base styling */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: url("background.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* Content container */
        .container {
            max-width: 800px;
            margin: 20px;
            padding: 50px 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 2.75rem;
            margin-bottom: 0.5em;
            letter-spacing: 0.03em;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 1.5em;
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 2.1rem;
            }

            p {
                font-size: 1.05rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hi, Maddie!</h1>

        <p>
            Welcome to your own personal webpage. Congratulations, you are famous!
        </p>

        <p>
            This space is made with love, just for you, from Grandma and Grandpa. Please check back often for updates and fun things from us. You are so special to us and we love you more than you can ever know!
        </p>

        <footer>
            © 2025
        </footer>
    </div>
</body>
</html>
