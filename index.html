<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maddie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: url("background.jpg") no-repeat center 30% fixed;
            background-size: cover;
            color: #5a2a3c;
        }

        /* Floating items container */
        .floaters {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Balloons */
        .balloon {
            position: absolute;
            bottom: -150px;
            border-radius: 50%;
            animation: floatUp linear forwards;
        }

        .balloon::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -25px;
            width: 2px;
            height: 25px;
            background: rgba(255,255,255,0.6);
            transform: translateX(-50%);
        }

        /* Cheeseburgers */
        .burger {
            position: absolute;
            bottom: -120px;
            font-size: 2.2rem;
            animation: floatUpBurger linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }
            to {
                transform: translateY(-120vh) translateX(40px);
                opacity: 0.9;
            }
        }

        @keyframes floatUpBurger {
            from {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(-120vh) translateX(-30px) rotate(20deg);
                opacity: 0.95;
            }
        }

        /* Birthday message box */
        .container {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 2;
            max-width: 500px;
            padding: 40px 35px;
            text-align: center;
            background: rgba(255, 205, 220, 0.85);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 0.5em;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container {
                top: auto;
                bottom: 20px;
                right: 20px;
                left: 20px;
                max-width: none;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating items -->
    <div class="floaters" id="floaters"></div>

    <!-- Message -->
    <div class="container">
        <h1>Happy Birthday, Maddie! 🎉</h1>

        <p>
            This page was made just for you. You're kind of famous now with your own page!
        </p>

        <p>
            We love you so much and hope your day is full of fun, smiles, balloons…
            <br><strong>and cheeseburgers!</strong> 🍔
            <br><br>
            Love, Grandma & Grandpa.
        </p>

        <footer>
            ❤️
        </footer>
    </div>

    <script>
        const balloonColors = [
            "#ff6b6b",
            "#ffd93d",
            "#6bcBef",
            "#6bcb77",
            "#c77dff",
            "#ff9f1c"
        ];

        function createBalloon() {
            const balloon = document.createElement("div");
            balloon.className = "balloon";

            const size = Math.random() * 30 + 40;
            balloon.style.width = size + "px";
            balloon.style.height = size * 1.2 + "px";

            balloon.style.left = Math.random() * 100 + "vw";
            balloon.style.background =
                balloonColors[Math.floor(Math.random() * balloonColors.length)];

            const duration = Math.random() * 10 + 12;
            balloon.style.animationDuration = duration + "s";

            document.getElementById("floaters").appendChild(balloon);

            setTimeout(() => balloon.remove(), duration * 1000);
        }

        function createBurger() {
            const burger = document.createElement("div");
            burger.className = "burger";
            burger.textContent = "🍔";

            burger.style.left = Math.random() * 100 + "vw";

            const duration = Math.random() * 8 + 10;
            burger.style.animationDuration = duration + "s";

            document.getElementById("floaters").appendChild(burger);

            setTimeout(() => burger.remove(), duration * 1000);
        }

        setInterval(createBalloon, 800);     // balloons
        setInterval(createBurger, 2500);     // cheeseburgers (less frequent)
    </script>

</body>
</html>
